name: Build GestãoSaaS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: https://cjimbazaifcztalheack.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_CrFb1MxH3kwfNKxW1gks7w_bCRHaIvR

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            command: package:win
            artifact: windows
          - platform: linux
            os: ubuntu-latest
            command: package:linux
            artifact: linux
          - platform: macos
            os: macos-latest
            command: package:mac
            artifact: macos
    continue-on-error: ${{ matrix.platform == 'macos' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop package
        run: npm run ${{ matrix.command }}

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: gestao-saas-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: gestao-saas-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' && needs.desktop.result != 'cancelled'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --generate-notes
